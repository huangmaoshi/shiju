# ====================================================================
# 拾句 · Docker Compose 一键部署
# 使用方式：
#   1. 复制 .env.example 为 .env 并修改配置
#   2. docker compose up -d --build
#   3. 访问 http://localhost:8080
# ====================================================================

services:
  # ========== PostgreSQL 数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: shiju-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-shiju}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-shiju}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== 后端 API 服务 ==========
  shiju-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shiju-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # ---- 数据库连接（默认 PostgreSQL）----
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/shiju?schema=public}
      PRISMA_SCHEMA: ${PRISMA_SCHEMA:-prisma/schema.postgres.prisma}
      # ---- JWT 配置 ----
      JWT_SECRET: ${JWT_SECRET:-change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      ADMIN_KEY: ${ADMIN_KEY:-shiju_admin_key}
    volumes:
      - ./server/data:/app/data   # SQLite 数据持久化目录（PG 模式下无影响）
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ========== 前端管理后台 ==========
  shiju-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: shiju-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      shiju-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

# ========== 数据卷 ==========
volumes:
  postgres_data:

# ====================================================================
# 以下为可选数据库配置，如需使用请：
#   1. 取消对应配置块的注释
#   2. 注释掉上面的 PostgreSQL 服务块
#   3. 修改 shiju-server 的 DATABASE_URL 及 PRISMA_SCHEMA
# ====================================================================

# ==================== SQLite（无独立服务，零配置）====================
# 无需额外服务，修改 shiju-server 的 environment 即可：
#   DATABASE_URL: "file:./data/dev.db"
#   PRISMA_SCHEMA: ""
# 数据库文件保存在 ./server/data/dev.db

