# ====== 拾句 · Docker Compose 一键部署 ======
# 使用方式：
#   1. 复制 .env.example 为 .env 并修改配置
#   2. docker compose up -d --build
#   3. 访问 http://localhost:8080/admin/login
#
# 数据库模式：
#   - 默认 SQLite（无需额外服务，数据持久化到 ./server/data）
#   - 可选 PostgreSQL（生产推荐）：在 .env 里设置 DATABASE_URL + PRISMA_SCHEMA，
#     并取消注释下方 postgres 服务块，同时让 shiju-server depends_on postgres

services:
  # ---- 后端 API 服务 ----
  shiju-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shiju-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # 数据库连接（默认 SQLite；切换 PostgreSQL 时在 .env 设置 DATABASE_URL）
      DATABASE_URL: ${DATABASE_URL:-file:./data/dev.db}
      # Prisma schema 文件（切换 PG 时设为 prisma/schema.postgres.prisma）
      PRISMA_SCHEMA: ${PRISMA_SCHEMA:-}
      JWT_SECRET: ${JWT_SECRET:-change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      ADMIN_KEY: ${ADMIN_KEY:-shiju_admin_key}
    volumes:
      # SQLite 数据文件持久化（PG 模式下无影响）
      - ./server/data:/app/data
    # PostgreSQL 模式下取消注释，确保数据库先启动
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- 管理后台（Nginx + React 静态） ----
  shiju-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: shiju-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      shiju-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

