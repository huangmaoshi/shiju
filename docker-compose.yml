# ====================================================================
# 拾句 · Docker Compose 一键部署（Python 版）
# 使用方式：
#   1. 复制 .env.example 为 .env 并修改配置（至少设置 GHCR_OWNER / GHCR_TAG）
#   2. docker compose up -d
#   3. 访问 http://localhost:6080  （管理后台）
#                    http://localhost:6010  （后端 API）
# ====================================================================

services:
  # ========== 后端 API 服务（Python · FastAPI · uvicorn）==========
  shiju-server:
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/shiju-server:${GHCR_TAG:-latest}
    pull_policy: always
    container_name: shiju-server
    restart: unless-stopped
    ports:
      - "${PORT:-6010}:6010"
    # 让容器内可以通过 host.docker.internal 访问宿主机上的 Ollama 等服务
    # AI 配置的 baseUrl 建议填 http://host.docker.internal:8800/v1 或 http://127.0.0.1:8800/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-6010}
      # ---- 数据库连接（默认 PostgreSQL）----
      # 注意：SQLAlchemy 的连接串，不要带 Prisma 的 ?schema=public 等参数
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/shiju}
      # ---- JWT 配置 ----
      JWT_SECRET: ${JWT_SECRET:-change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      ADMIN_KEY: ${ADMIN_KEY:-shiju_admin_key}
    volumes:
      # SQLite 模式下数据持久化（PG 模式无影响）
      - ./server/data:/app/data
    networks:
      - common_net
    healthcheck:
      # 用 curl 探测健康检查端点（python:3.11-slim 已装 curl）
      test: ["CMD-SHELL", "curl -fs http://localhost:6010/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========== 前端管理后台（React + Nginx）==========
  shiju-web:
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/shiju-web:${GHCR_TAG:-latest}
    pull_policy: always
    container_name: shiju-web
    restart: unless-stopped
    ports:
      - "6080:80"
    depends_on:
      shiju-server:
        condition: service_healthy
    networks:
      - common_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  common_net:
    name: common_ne

# ====================================================================
# 以下为可选数据库配置，如需使用请：
#   1. 取消对应配置块的注释
#   2. 注释掉上面的 PostgreSQL 服务块
#   3. 修改 shiju-server 的 DATABASE_URL
# ====================================================================

# ==================== SQLite（无独立服务，零配置）====================
# 无需额外服务，只需在 shiju-server 的 environment 改为：
#   DATABASE_URL: "sqlite:///data/dev.db"
# 然后注释掉 postgres 服务块和 depends_on
# 数据库文件通过 ./server/data:/app/data 卷持久化

