# ====================================================================
# 端口速查表
#   6010  - 后端 API（可通过 PORT 环境变量修改）
#   5173  - 前端 Vite dev server（仅本地开发）
#   6080  - 前端 Nginx 生产容器端口
#   5432  - PostgreSQL（可通过 PG_PORT 修改）
