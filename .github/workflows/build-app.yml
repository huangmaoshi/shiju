# 拾句移动端 App 构建工作流
# 触发方式：push tag（如 v1.0.0）或手动触发
# 产出：Android APK + iOS IPA（iOS 需 Apple Developer 账号配置证书）
#
# 使用：
#   git tag v1.0.0 && git push origin v1.0.0
# 或在 GitHub 仓库 → Actions → Build App → Run workflow

name: Build App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ============ Android 构建 ============
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native projects (android/ios)
        # app/ 目录缺少 android/ 和 ios/ 原生工程，首次构建需要生成
        run: flutter create . --org com.shiju --project-name shi_ju --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK
        # 通过 --dart-define 注入生产 API 地址（在 GitHub Secrets 配置 API_BASE_URL）
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            ${{ secrets.API_BASE_URL != '' && format('--dart-define=API_BASE_URL={0}', secrets.API_BASE_URL) || '' }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  # ============ iOS 构建 ============
  # 需要 Apple Developer 账号，在 GitHub Secrets 配置：
  #   BUILD_CERTIFICATE_BASE64  - 开发/分发证书（base64）
  #   BUILD_PROVISION_PROFILE_BASE64 - 描述文件（base64）
  #   P12_PASSWORD - 证书密码
  #   KEYCHAIN_PASSWORD - 钥匙串密码（任意随机串）
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native projects (ios)
        # app/ 目录缺少 ios/ 原生工程，首次构建需要生成
        run: flutter create . --org com.shiju --project-name shi_ju --platforms=ios

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # 导入证书
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain

          # 导入描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Build iOS
        # 通过 --dart-define 注入生产 API 地址（在 GitHub Secrets 配置 API_BASE_URL）
        run: |
          flutter build ios --release \
            ${{ secrets.API_BASE_URL != '' && format('--dart-define=API_BASE_URL={0}', secrets.API_BASE_URL) || '' }} \
            --no-codesign || flutter build ios --release

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: |
            app/build/ios/iphoneos/Runner.app
            app/build/ios/archive/*.xcarchive
          retention-days: 30
