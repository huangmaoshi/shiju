# 拾句 iOS App 构建工作流
# 触发：默认仅手动 Run workflow；如需代码提交自动构建，取消下面 push 块注释
# 产出：Runner.xcarchive + 可上架 IPA（证书齐全时）；无证书仅未签名 xcarchive
# Secrets 清单（GitHub 仓库 Secrets）
#   BUILD_CERTIFICATE_BASE64     - p12分发证书 base64
#   BUILD_PROVISION_PROFILE_BASE64 - mobileprovision描述文件 base64
#   P12_PASSWORD                 - p12证书密码
#   API_BASE_URL（可选）         - 生产接口地址
name: Build iOS

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ] # 取消注释开启 push 自动构建

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      # 统一处理 dart define，空的时候为空字符串
      DART_DEFINE: ${{ secrets.API_BASE_URL != '' && format('--dart-define=API_BASE_URL={0}', secrets.API_BASE_URL) || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Generate iOS native project (only if ios folder missing)
        run: |
          if [ ! -d ios ]; then
            echo "ios folder not found, run flutter create"
            flutter create . --org com.shiju --project-name shi_ju --platforms=ios
          else
            echo "ios folder already exists, skip flutter create"
          fi

      - name: Install pub dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze || true

      # ========== 导入签名证书（有 secrets 才执行） ==========
      - name: Import Apple signing certificate & provision profile
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          provision-profile-base64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

      # ========== 构建归档 ==========
      - name: Build iOS archive (signed)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          flutter build ios --release ${{ env.DART_DEFINE }}

      - name: Build iOS archive (unsigned fallback)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' || secrets.BUILD_PROVISION_PROFILE_BASE64 == '' }}
        run: |
          flutter build ios --release --no-codesign ${{ env.DART_DEFINE }}

      # ========== 证书齐全：从 xcarchive 导出 IPA ==========
      - name: Export IPA from archive
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/export

      # ========== 上传产物 Artifact ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: |
            app/build/ios/archive/Runner.xcarchive
            app/build/ios/export/*.ipa
          retention-days: 30
