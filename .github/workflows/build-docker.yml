# 拾句 Docker 镜像构建工作流
# 触发：push tag v*、push 到 main 改动 server/web/docker-compose/.env.example、手动触发
# 产出：
#   - Docker 镜像 push 到 GHCR（ghcr.io/<owner>/shiju-server / shiju-web）
#   - 构建产物 tar 上传到 Artifacts（便于无 GHCR 权限场景下载）
#
# 前置：
#   1. 仓库 Settings → Actions → General → Workflow permissions 勾选 "Read and write permissions"
#   2. 首次推送后镜像默认是 private，到 ghcr.io 自己的 Packages 里可改 public
#
# 本地拉取：
#   docker pull ghcr.io/<your-github-username>/shiju-server:latest
#   docker pull ghcr.io/<your-github-username>/shiju-web:latest

name: Build Docker

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/build-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名小写（GHCR 要求）
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/shiju-server
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/shiju-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 GHCR 需要

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.SERVER_IMAGE }}
            ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=tag               # v1.0.0
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short             # sha-abc1234

      # ============ 构建后端镜像 ============
      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags && format('{0},{1}', env.SERVER_IMAGE, steps.meta.outputs.tags) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============ 构建前端镜像 ============
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags && format('{0},{1}', env.WEB_IMAGE, steps.meta.outputs.tags) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
