# 拾句 Android App 构建工作流
# 触发：push tag v* 或手动 Run workflow
# 产出：app-release.apk（上传到 Artifacts + GitHub Releases）
#
# 无需任何证书，推 tag 即可。可选在 Secrets 配置 API_BASE_URL 注入生产 API 地址。

name: Build Android

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native android project
        # app/ 目录缺少 android/ 原生工程，首次构建需要生成
        run: flutter create . --org com.shiju --project-name shi_ju --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK
        # 通过 --dart-define 注入生产 API 地址（在 GitHub Secrets 配置 API_BASE_URL）
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            ${{ secrets.API_BASE_URL != '' && format('--dart-define=API_BASE_URL={0}', secrets.API_BASE_URL) || '' }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
