# 拾句 Android App 构建工作流
# 触发：手动 Run workflow（不在 push/commit 时自动触发）
# 产出：app-release.apk（上传到 Artifacts；可选发布到 GitHub Releases）
#
# 无需任何证书。可选在 Secrets 配置 API_BASE_URL 注入生产 API 地址。

name: Build Android

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否同时发布到 GitHub Releases'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate native android project
        # app/ 目录缺少 android/ 原生工程，首次构建需要生成
        run: flutter create . --org com.shiju --project-name shi_ju --platforms=android

      - name: Allow cleartext HTTP for Android
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest_path.exists():
              raise SystemExit('AndroidManifest.xml not found after flutter create')

          text = manifest_path.read_text(encoding='utf-8')
          if 'android:usesCleartextTraffic="true"' not in text:
              text = text.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
              manifest_path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        # 通过 --dart-define 注入生产 API 地址（在 GitHub Secrets 配置 API_BASE_URL）
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            ${{ secrets.API_BASE_URL != '' && format('--dart-define=API_BASE_URL={0}', secrets.API_BASE_URL) || '' }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to Release
        # 手动触发时通过输入参数控制是否发布
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
